# Pull-request validation, kept to a few minutes: exactly one unoptimized build per platform, which
# every test suite runs against (Linux with ASan/UBSan, macOS plain), as two parallel jobs. ccache keeps the
# engine shards between runs (ci/run-ci on the self-hosted runner, actions/cache on macOS).
#
# The optimized release build, the Debian package rehearsal and the Homebrew formula live in
# package.yml: they run when packaging changes, on main and at release, not on every PR.
# Nothing here talks to a FortiGate (AGENTS.md). Linux steps run in the disposable CI container
# (ci/run-ci, ci/Containerfile).

# Parallelism: every core the memory allows (ci/build-jobs: 2.5 GB per job, the engine shards'
# GCC peak). ci/run-ci gives the container three quarters of the host's RAM.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VL_RELEASE_TAG: v0.5.0
  # Stock image for clean-install smoke tests (same digest as ci/Containerfile's base).
  UBUNTU_IMAGE: docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55

jobs:
  linux:
    name: Build and tests (Ubuntu 24.04, GCC 13, ASan/UBSan)
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","ubuntu-latest-lts"]') }}
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Toolchain
        run: |
          g++ --version | head -1
          meson --version
          ccache --version | head -1

      # One build, every suite: unoptimized (mock tests do not need optimization; it only slows the
      # engine shards), warnings are errors, and ASan/UBSan on every hand-written TU (the generated
      # shards stay uninstrumented, engine/meson.build). The integration suite runs the real binary
      # against the mock FortiOS over TLS.
      - name: Build (warnings are errors) and run the tests
        run: |
          meson setup build/ci -Dtests=enabled -Dforti-api:tests=disabled --buildtype=plain -Doptimization=0 -Ddebug=false \
            -Dwerror=true -Db_sanitize=address,undefined -Db_lundef=false
          meson compile -C build/ci -j "$(ci/build-jobs)"
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 meson test -C build/ci --suite unit --suite integration --print-errorlogs
          ci/smoke-test.sh build/ci/src/cli/forti
          ccache --show-stats | head -5

  macos:
    name: Build and tests (macOS, Apple clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Homebrew packages
        run: brew install meson ninja googletest ccache

      # Keyed by the SDK pin and the engine's SDK glue: a PR that touches neither restores every
      # engine shard from the cache.
      - name: Compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ hashFiles('subprojects/forti-api.wrap', 'engine/src/catalog_shard.cpp', 'engine/src/ops.hpp') }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ hashFiles('subprojects/forti-api.wrap', 'engine/src/catalog_shard.cpp', 'engine/src/ops.hpp') }}-
            ccache-macos-

      - name: Build and run the tests
        run: |
          clang++ --version | head -1
          meson setup build -Dtests=enabled -Dforti-api:tests=disabled --buildtype=plain -Doptimization=0 -Ddebug=false -Dwerror=true
          meson compile -C build -j "$(ci/build-jobs)"
          meson test -C build --suite unit --suite integration --print-errorlogs
          ci/smoke-test.sh build/src/cli/forti
          ccache --show-stats | head -5

  # Installs the formula (with forti-api from valkyrianlabs/tap) from a throwaway local tap and runs
  # its test block. Homebrew builds from source in its own sandbox, so this job is separate and runs
  # in parallel. Skipped while no release docs are staged, since `vlr prepare` would refuse.
